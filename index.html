<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>단이의 곱셈 모험!</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    min-height: 100%;
}

body {
    margin: 0;
    min-height: 100dvh;
    background: #dff3df;
    font-family: 'Jua', sans-serif;
    color: #5b382c;
    user-select: none;
    overflow-x: hidden;
}

/* 전체 게임 */

.game {
    width: 100%;
    max-width: 760px;
    min-height: 100dvh;
    margin: auto;
    padding: 12px 14px 22px;
    position: relative;
    overflow: hidden;

    background:
        linear-gradient(
            to bottom,
            #bdebf6 0%,
            #d9f3d0 43%,
            #b6dd8e 100%
        );
}

/* 구름 */

.cloud {
    position: absolute;
    font-size: 42px;
    opacity: .8;
    pointer-events: none;
    animation: cloudMove 5s ease-in-out infinite alternate;
}

.cloud1 {
    left: 10px;
    top: 90px;
}

.cloud2 {
    right: 5px;
    top: 145px;
}

@keyframes cloudMove {

    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-8px);
    }
}

/* 상단 정보 */

.top {
    position: relative;
    z-index: 5;

    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 10px;
}

.level-box,
.score-box {

    background: #fffaf0;

    border: 3px solid #e8c99f;

    border-radius: 22px;

    box-shadow: 0 5px 0 #d5b789;

    padding: 7px 13px;
}

.level-box {
    font-size: 20px;
    line-height: 1.05;
}

.level-small {
    font-size: 14px;
}

.score-box {
    display: flex;
    gap: 12px;
    font-size: 18px;
}

.score-number {
    color: #d77b35;
}

/* =========================
   제목 배너
========================= */

.title-banner {

    position: relative;
    z-index: 4;

    width: 92%;

    margin: 7px auto 12px;

    padding: 13px 10px 11px;

    text-align: center;

    background: #fff0d9;

    border: 4px solid #c98a5a;

    border-radius: 25px;

    box-shadow:
        0 7px 0 #b66e47,
        0 0 0 3px #fff7e9;
}

.title-banner::before,
.title-banner::after {

    content: "🐾";

    position: absolute;

    top: 15px;

    font-size: 25px;
}

.title-banner::before {
    left: 12px;
}

.title-banner::after {
    right: 12px;
}

.title-main {

    font-size: 32px;

    color: #814b35;

    text-shadow:
        2px 2px 0 white;

    letter-spacing: 1px;
}

.title-sub {

    display: block;

    margin-top: 3px;

    font-size: 16px;

    color: #e87994;
}

/* =========================
   게임 장면
========================= */

.scene {

    position: relative;

    height: 235px;

    overflow: hidden;

    border-radius: 30px;

    border: 5px solid #fff8ec;

    background:
        linear-gradient(
            to bottom,
            #bcebf7 0%,
            #cfeef0 48%,
            #d9f2bd 49%,
            #9bd16f 100%
        );

    box-shadow: 0 6px 0 #91c578;
}

/* 태양 */

.sun {

    position: absolute;

    right: 30px;

    top: 18px;

    font-size: 50px;

    animation: sunMove 4s ease-in-out infinite alternate;
}

@keyframes sunMove {

    from {
        transform: rotate(-5deg);
    }

    to {
        transform: rotate(5deg);
    }
}

/* 나무 */

.tree {

    position: absolute;

    bottom: 40px;

    font-size: 52px;

    z-index: 2;
}

.tree1 {
    left: 12px;
}

.tree2 {
    right: 8px;
}

/* 언덕 */

.hill1 {

    position: absolute;

    width: 120%;
    height: 135px;

    left: -10%;
    bottom: -82px;

    border-radius: 50%;

    background: #91ce6d;

    z-index: 1;
}

.hill2 {

    position: absolute;

    width: 100%;
    height: 115px;

    right: -30%;
    bottom: -70px;

    border-radius: 50%;

    background: #a9dc7d;

    z-index: 1;
}

/* 꽃 */

.flowers {

    position: absolute;

    left: 8px;
    bottom: 5px;

    font-size: 25px;

    z-index: 3;
}

/* =========================
   단이
========================= */

.dani {

    position: absolute;

    right: 7%;

    bottom: 20px;

    z-index: 4;

    font-size: 92px;

    filter:
        drop-shadow(
            0 6px 4px rgba(0,0,0,.18)
        );

    animation:
        daniBreath 2s ease-in-out infinite;
}

@keyframes daniBreath {

    50% {
        transform: translateY(-5px);
    }
}

.dani-happy {

    animation:
        daniHappy .55s ease-in-out infinite alternate;
}

@keyframes daniHappy {

    from {
        transform:
            translateY(0)
            rotate(-5deg);
    }

    to {
        transform:
            translateY(-28px)
            rotate(7deg);
    }
}

.dani-sad {

    animation:
        daniSad .4s ease-in-out infinite alternate;
}

@keyframes daniSad {

    from {
        transform: rotate(0);
    }

    to {
        transform: rotate(-9deg);
    }
}

/* =========================
   말풍선
========================= */

.bubble {

    position: absolute;

    left: 6%;
    top: 28px;

    width: 53%;

    padding: 12px 10px;

    background: white;

    border: 4px solid #f2a8bd;

    border-radius: 23px;

    text-align: center;

    font-size: 18px;

    line-height: 1.25;

    box-shadow: 0 5px 0 #e5ccd3;

    z-index: 5;
}

.bubble::after {

    content: "";

    position: absolute;

    right: 18%;

    bottom: -18px;

    border:
        17px solid transparent;

    border-top-color: #f2a8bd;
}

/* =========================
   문제
========================= */

.question {

    width: fit-content;
    max-width: 95%;

    margin: 15px auto 12px;

    padding: 9px 24px;

    background: #fffaf0;

    border: 4px solid #e4c39c;

    border-radius: 23px;

    box-shadow: 0 6px 0 #cdae82;

    font-size: 39px;

    color: #603b2d;

    text-align: center;
}

/* =========================
   발바닥 답 버튼
========================= */

.answers {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;

    width: 100%;

    max-width: 650px;

    margin: 0 auto;
}

.answer {

    position: relative;

    min-height: 78px;

    border: 0;

    border-radius: 25px;

    background: #f28bb0;

    color: white;

    font-family: 'Jua', sans-serif;

    font-size: 31px;

    box-shadow:
        0 8px 0 #d72d68;

    cursor: pointer;

    transition:
        transform .1s,
        box-shadow .1s;
}

/* 발바닥 느낌 */

.answer::before {

    content: "●  ●";

    position: absolute;

    top: 7px;

    left: 50%;

    transform:
        translateX(-50%);

    font-size: 12px;

    letter-spacing: 5px;

    opacity: .55;
}

.answer:active {

    transform:
        translateY(7px);

    box-shadow:
        0 1px 0 #d72d68;
}

.answer.correct {

    background: #82d578;

    box-shadow:
        0 8px 0 #4ca94b;
}

.answer.wrong {

    background: #bcbcbc;

    box-shadow:
        0 8px 0 #888;
}

/* =========================
   아래쪽
========================= */

.bottom {

    display: flex;

    align-items: center;

    gap: 8px;

    margin-top: 14px;
}

.action {

    border: 0;

    background: #fff2db;

    color: #70432e;

    border-radius: 17px;

    padding: 9px 12px;

    font-family: 'Jua', sans-serif;

    font-size: 16px;

    white-space: nowrap;

    box-shadow:
        0 4px 0 #d2b18a;
}

.progress {

    flex: 1;

    background: white;

    border: 3px solid #e3c9a5;

    border-radius: 17px;

    padding: 5px;
}

.progress-bar {

    height: 12px;

    width: 0%;

    background: #ffd265;

    border-radius: 12px;

    transition:
        width .3s;
}

/* =========================
   정답 팝업
========================= */

.popup {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    background:
        rgba(70,50,40,.38);

    z-index: 100;
}

.popup-card {

    width: 82%;

    max-width: 350px;

    padding: 24px;

    text-align: center;

    background: #fff8ec;

    border: 5px solid #efafc4;

    border-radius: 30px;

    box-shadow:
        0 9px 0 #c58470;
}

.popup-big {
    font-size: 60px;
}

.popup-title {
    font-size: 29px;
    margin: 4px;
}

.popup-text {
    white-space: pre-line;
    font-size: 19px;
    margin: 10px 0 18px;
}

.next-button {

    border: 0;

    padding: 11px 25px;

    background: #f28bb0;

    color: white;

    border-radius: 19px;

    font-family: 'Jua', sans-serif;

    font-size: 19px;

    box-shadow:
        0 5px 0 #d72d68;
}

/* =========================
   작은 아이폰 화면
========================= */

@media (max-width: 430px) {

    .game {
        padding:
            9px
            10px
            18px;
    }

    .level-box {
        font-size: 18px;
        padding: 6px 10px;
    }

    .level-small {
        font-size: 12px;
    }

    .score-box {
        font-size: 15px;
        gap: 7px;
        padding: 6px 9px;
    }

    .title-banner {
        margin-top: 5px;
        margin-bottom: 10px;
        padding: 10px 8px;
    }

    .title-main {
        font-size: 27px;
    }

    .title-sub {
        font-size: 14px;
    }

    .scene {
        height: 215px;
    }

    .bubble {
        top: 25px;
        left: 5%;
        width: 57%;
        font-size: 16px;
        padding: 10px 7px;
    }

    .dani {
        font-size: 78px;
        right: 2%;
        bottom: 18px;
    }

    .tree {
        font-size: 45px;
    }

    .sun {
        font-size: 43px;
        right: 20px;
    }

    .question {
        margin-top: 13px;
        margin-bottom: 10px;
        padding: 8px 18px;
        font-size: 34px;
    }

    .answers {
        gap: 9px;
    }

    .answer {
        min-height: 70px;
        border-radius: 22px;
        font-size: 28px;
        box-shadow:
            0 7px 0 #d72d68;
    }

    .bottom {
        margin-top: 12px;
    }

    .action {
        padding: 8px 9px;
        font-size: 14px;
    }

    .progress-bar {
        height: 10px;
    }
}

</style>
</head>


<body>

<div class="game">

    <!-- 배경 구름 -->

    <div class="cloud cloud1">☁️</div>

    <div class="cloud cloud2">☁️</div>


    <!-- 상단 정보 -->

    <div class="top">

        <div class="level-box">

            ⭐ LV. <span id="level">2</span>

            <br>

            <span class="level-small">
                쿠키 언덕
            </span>

        </div>


        <div class="score-box">

            ⭐
            <span
                class="score-number"
                id="score"
            >0</span>

            🍖
            <span
                class="score-number"
                id="coins"
            >100</span>

        </div>

    </div>


    <!-- 제목 -->

    <div class="title-banner">

        <div class="title-main">

            단이의 곱셈 모험!

        </div>

        <span class="title-sub">

            맛있는 간식을 찾아서 출발! 🐶💕

        </span>

    </div>


    <!-- 게임 장면 -->

    <div class="scene">

        <div class="sun">
            ☀️
        </div>


        <div class="tree tree1">
            🌳
        </div>


        <div class="tree tree2">
            🌳
        </div>


        <div class="hill1"></div>

        <div class="hill2"></div>


        <div class="flowers">
            🌷 🌼 🌸 🌼
        </div>


        <!-- 말풍선 -->

        <div
            class="bubble"
            id="message"
        >
            이 문제의 정답은 뭘까? 💕
        </div>


        <!-- 단이 -->

        <div
            class="dani"
            id="dani"
        >
            🐶
        </div>

    </div>


    <!-- 문제 -->

    <div
        class="question"
        id="question"
    >
        3 × 2 = ?
    </div>


    <!-- 정답 -->

    <div class="answers">

        <button
            class="answer"
            id="answer0"
            onclick="checkAnswer(0)"
        >
            5
        </button>


        <button
            class="answer"
            id="answer1"
            onclick="checkAnswer(1)"
        >
            6
        </button>


        <button
            class="answer"
            id="answer2"
            onclick="checkAnswer(2)"
        >
            8
        </button>

    </div>


    <!-- 하단 -->

    <div class="bottom">

        <button
            class="action"
            onclick="restartGame()"
        >
            ↩ 처음부터
        </button>


        <div class="progress">

            <div
                class="progress-bar"
                id="progressBar"
            ></div>

        </div>


        <button
            class="action"
            onclick="showHint()"
        >
            💡 힌트
        </button>

    </div>

</div>


<!-- 정답 팝업 -->

<div
    class="popup"
    id="popup"
>

    <div class="popup-card">

        <div class="popup-big">
            🐶💕🍖
        </div>


        <div class="popup-title">
            정답이야!
        </div>


        <div
            class="popup-text"
            id="popupText"
        >
            단이가 맛있는 간식을 받았어요!
        </div>


        <button
            class="next-button"
            onclick="nextQuestion()"
        >
            다음 문제
        </button>

    </div>

</div>


<script>

/* =========================
   게임 변수
========================= */

let answer = 0;

let correctPosition = 0;

let score = 0;

let coins = 100;

let level = 2;

let solved = 0;


/* =========================
   화면 요소
========================= */

const dani =
    document.getElementById("dani");

const message =
    document.getElementById("message");

const question =
    document.getElementById("question");

const scoreText =
    document.getElementById("score");

const coinsText =
    document.getElementById("coins");

const levelText =
    document.getElementById("level");

const progressBar =
    document.getElementById("progressBar");

const popup =
    document.getElementById("popup");

const popupText =
    document.getElementById("popupText");


const buttons = [

    document.getElementById("answer0"),

    document.getElementById("answer1"),

    document.getElementById("answer2")

];


/* =========================
   새 문제 만들기
========================= */

function nextQuestion() {

    popup.style.display = "none";


    dani.className = "dani";


    message.innerText =
        "이 문제의 정답은 뭘까? 💕";


    buttons.forEach(function(button) {

        button.disabled = false;

        button.className = "answer";

    });


    /* 2단 ~ 4단 */

    const number1 =
        Math.floor(Math.random() * 3) + 2;


    /* ×2 ~ ×9 */

    const number2 =
        Math.floor(Math.random() * 8) + 2;


    answer =
        number1 * number2;


    question.innerText =
        number1 +
        " × " +
        number2 +
        " = ?";


    /* 정답 위치 */

    correctPosition =
        Math.floor(Math.random() * 3);


    /* 오답 */

    let wrong1 =
        answer +
        Math.floor(Math.random() * 3) +
        1;


    let wrong2 =
        answer -
        (Math.floor(Math.random() * 3) + 1);


    if (
        wrong2 <= 0 ||
        wrong2 === wrong1
    ) {

        wrong2 =
            answer + 5;

    }


    const options = [];


    options[correctPosition] =
        answer;


    options[
        (correctPosition + 1) % 3
    ] = wrong1;


    options[
        (correctPosition + 2) % 3
    ] = wrong2;


    buttons.forEach(function(
        button,
        index
    ) {

        button.innerText =
            options[index];

    });


    updateProgress();

}


/* =========================
   정답 확인
========================= */

function checkAnswer(index) {

    buttons.forEach(function(button) {

        button.disabled = true;

    });


    /* 정답 */

    if (
        index === correctPosition
    ) {

        score += 10;

        coins += 10;

        solved++;


        buttons[index]
            .classList
            .add("correct");


        dani.className =
            "dani dani-happy";


        message.innerText =
            "정답이야! 🎉\n단이가 신났어요!";


        /* 10문제마다 레벨업 */

        if (
            solved % 10 === 0
        ) {

            level++;

            levelText.innerText =
                level;

        }


        updateScore();


        popupText.innerText =
            "⭐ 별 +10\n" +
            "🍖 간식 +10\n\n" +
            "현재 간식 " +
            coins +
            "개!";


        popup.style.display =
            "flex";


    }

    /* 오답 */

    else {

        buttons[index]
            .classList
            .add("wrong");


        dani.className =
            "dani dani-sad";


        message.innerText =
            "앗, 아쉬워! 💦\n" +
            "다시 한번 생각해보자!";


        setTimeout(
            function() {

                nextQuestion();

            },
            1300
        );

    }

}


/* =========================
   힌트
========================= */

function showHint() {

    const parts =
        question.innerText
            .replace("?", "")
            .split("×");


    if (parts.length === 2) {

        const a =
            parseInt(parts[0]);

        const b =
            parseInt(parts[1]);


        message.innerText =
            "💡 힌트!\n" +
            a +
            "을 " +
            b +
            "번 더해보자!";

    }

}


/* =========================
   점수 업데이트
========================= */

function updateScore() {

    scoreText.innerText =
        score;

    coinsText.innerText =
        coins;

}


/* =========================
   진행도
========================= */

function updateProgress() {

    const progress =
        (solved % 10) * 10;


    progressBar.style.width =
        progress + "%";

}


/* =========================
   처음부터
========================= */

function restartGame() {

    score = 0;

    coins = 100;

    level = 2;

    solved = 0;


    scoreText.innerText =
        "0";

    coinsText.innerText =
        "100";

    levelText.innerText =
        "2";


    progressBar.style.width =
        "0%";


    nextQuestion();

}


/* =========================
   게임 시작
========================= */

nextQuestion();

</script>

</body>
</html>
