<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>단이의 곱셈 모험</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}

body {

    margin: 0;

    background: #dff4df;

    font-family: 'Jua', sans-serif;

    color: #5b3a2d;

    user-select: none;

}

.game {

    width: 100%;

    max-width: 760px;

    min-height: 100vh;

    margin: auto;

    padding: 14px;

    overflow: hidden;

    position: relative;

    background:

        radial-gradient(circle at 10% 20%, #ffffff 0 35px, transparent 36px),

        radial-gradient(circle at 88% 17%, #ffffff 0 30px, transparent 31px),

        linear-gradient(

            to bottom,

            #bcecf7 0%,

            #d9f4d0 43%,

            #b8df91 100%

        );

}

/* 구름 */

.cloud {

    position: absolute;

    font-size: 48px;

    opacity: .8;

    animation: cloudMove 5s infinite alternate ease-in-out;

}

.cloud1 {

    left: 15px;

    top: 85px;

}

.cloud2 {

    right: 20px;

    top: 150px;

    font-size: 40px;

}

@keyframes cloudMove {

    from { transform: translateY(0); }

    to { transform: translateY(-8px); }

}

/* 상단 */

.top {

    display: flex;

    justify-content: space-between;

    align-items: center;

    position: relative;

    z-index: 3;

}

.level-box,

.score-box {

    background: #fffaf0;

    border: 3px solid #e8c99f;

    border-radius: 24px;

    padding: 9px 15px;

    box-shadow: 0 5px 0 #d4b486;

}

.level-box {

    font-size: 22px;

}

.level-small {

    font-size: 15px;

}

.score-box {

    display: flex;

    gap: 15px;

    font-size: 20px;

}

.score-box span {

    color: #d97835;

}

/* 제목 */

.title {

    position: relative;

    z-index: 2;

    text-align: center;

    margin: 18px auto 15px;

    width: fit-content;

    max-width: 95%;

    background: #fff1dc;

    border: 4px solid #c88758;

    border-radius: 28px;

    padding: 10px 25px;

    box-shadow: 0 7px 0 #b56d45;

}

.title-main {

    font-size: 36px;

    color: #874c35;

    text-shadow: 2px 2px #fff;

}

.title-sub {

    display: block;

    margin-top: 3px;

    color: #e87591;

    font-size: 18px;

}

/* 게임 장면 */

.scene {

    height: 300px;

    position: relative;

    overflow: hidden;

    border: 5px solid #fff8eb;

    border-radius: 35px;

    background:

        linear-gradient(#bcecf7 0 42%, #d9f3bd 43% 100%);

    box-shadow: 0 7px 0 #91c77b;

}

/* 해 */

.sun {

    position: absolute;

    right: 28px;

    top: 18px;

    font-size: 60px;

    animation: sunMove 4s infinite alternate ease-in-out;

}

@keyframes sunMove {

    from { transform: rotate(-5deg); }

    to { transform: rotate(5deg); }

}

/* 언덕 */

.hill {

    position: absolute;

    width: 120%;

    height: 180px;

    left: -10%;

    bottom: -95px;

    border-radius: 50%;

    background: #91ce6c;

}

.hill2 {

    position: absolute;

    width: 100%;

    height: 150px;

    right: -35%;

    bottom: -80px;

    border-radius: 50%;

    background: #a9dc7d;

}

/* 나무 */

.tree {

    position: absolute;

    font-size: 60px;

    bottom: 55px;

}

.tree1 {

    left: 12px;

}

.tree2 {

    right: 8px;

}

/* 꽃 */

.flowers {

    position: absolute;

    bottom: 7px;

    left: 10px;

    font-size: 27px;

}

/* 단이 */

.dani {

    position: absolute;

    right: 7%;

    bottom: 28px;

    font-size: 115px;

    filter: drop-shadow(0 7px 4px rgba(0,0,0,.18));

    animation: daniBreath 2s infinite ease-in-out;

}

@keyframes daniBreath {

    50% {

        transform: translateY(-6px);

    }

}

.dani-happy {

    animation: daniHappy .55s infinite alternate;

}

@keyframes daniHappy {

    from {

        transform: translateY(0) rotate(-5deg);

    }

    to {

        transform: translateY(-35px) rotate(7deg);

    }

}

.dani-sad {

    animation: daniSad .4s infinite alternate;

}

@keyframes daniSad {

    from { transform: rotate(0); }

    to { transform: rotate(-10deg); }

}

/* 말풍선 */

.bubble {

    position: absolute;

    left: 6%;

    top: 35px;

    width: 52%;

    padding: 15px 12px;

    background: white;

    border: 4px solid #f2a9bd;

    border-radius: 25px;

    font-size: 21px;

    text-align: center;

    box-shadow: 0 5px 0 #e4cbd2;

}

.bubble::after {

    content: "";

    position: absolute;

    right: 18%;

    bottom: -20px;

    border: 18px solid transparent;

    border-top-color: #f2a9bd;

}

/* 문제 */

.question {

    margin: 22px auto 15px;

    width: fit-content;

    max-width: 95%;

    background: #fffaf1;

    border: 4px solid #e4c39a;

    border-radius: 25px;

    padding: 12px 25px;

    font-size: 43px;

    color: #603d30;

    box-shadow: 0 6px 0 #cfae83;

}

/* 정답 버튼 */

.answers {

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 14px;

    max-width: 650px;

    margin: auto;

}

.answer {

    min-height: 100px;

    border: none;

    border-radius: 30px;

    background: #f28caf;

    color: white;

    font-family: 'Jua', sans-serif;

    font-size: 36px;

    box-shadow: 0 9px 0 #d82d68;

    cursor: pointer;

}

.answer:active {

    transform: translateY(8px);

    box-shadow: 0 1px 0 #d82d68;

}

.answer.correct {

    background: #82d678;

    box-shadow: 0 9px 0 #4ca84b;

}

.answer.wrong {

    background: #bdbdbd;

    box-shadow: 0 9px 0 #888;

}

/* 하단 */

.bottom {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-top: 18px;

}

.action {

    border: none;

    background: #fff3dc;

    color: #70442f;

    border-radius: 20px;

    padding: 12px 16px;

    font-family: 'Jua', sans-serif;

    font-size: 18px;

    box-shadow: 0 5px 0 #d3b38b;

}

.progress {

    flex: 1;

    background: white;

    border: 3px solid #e3cba9;

    border-radius: 20px;

    padding: 6px;

}

.progress-bar {

    height: 15px;

    width: 0%;

    background: #ffd467;

    border-radius: 15px;

    transition: width .3s;

}

/* 정답 팝업 */

.popup {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    background: rgba(70,50,40,.35);

    z-index: 20;

}

.popup-card {

    width: 85%;

    max-width: 360px;

    padding: 25px;

    text-align: center;

    background: #fff8ec;

    border: 5px solid #efaec3;

    border-radius: 30px;

    box-shadow: 0 10px 0 #c48670;

}

.popup-big {

    font-size: 65px;

}

.popup-title {

    font-size: 30px;

    margin: 5px;

}

.popup-text {

    font-size: 20px;

}

.next-button {

    border: none;

    padding: 12px 28px;

    background: #f28caf;

    color: white;

    border-radius: 20px;

    font-family: 'Jua', sans-serif;

    font-size: 20px;

    box-shadow: 0 5px 0 #d82d68;

}

/* 모바일 */

@media (max-width: 500px) {

    .title-main {

        font-size: 30px;

    }

    .title-sub {

        font-size: 16px;

    }

    .scene {

        height: 270px;

    }

    .dani {

        font-size: 92px;

        right: 3%;

    }

    .bubble {

        width: 58%;

        font-size: 17px;

    }

    .question {

        font-size: 38px;

        padding: 10px 20px;

    }

    .answer {

        min-height: 85px;

        font-size: 30px;

    }

    .score-box {

        font-size: 16px;

        gap: 8px;

    }

    .level-box {

        font-size: 19px;

    }

}

</style>

</head>

<body>

<div class="game">

    <div class="cloud cloud1">☁️</div>

    <div class="cloud cloud2">☁️</div>

    <div class="top">

        <div class="level-box">

            ⭐ LV. <span id="level">2</span>

            <br>

            <span class="level-small">쿠키 언덕</span>

        </div>

        <div class="score-box">

            ⭐ <span id="score">0</span>

            🍖 <span id="coins">100</span>

        </div>

    </div>

    <div class="title">

        <div class="title-main">

            🐾 단이의 곱셈 모험 🐾

        </div>

        <span class="title-sub">

            맛있는 간식을 찾아서 출발!

        </span>

    </div>

    <div class="scene">

        <div class="sun">☀️</div>

        <div class="tree tree1">🌳</div>

        <div class="tree tree2">🌳</div>

        <div class="hill"></div>

        <div class="hill2"></div>

        <div class="flowers">

            🌷 🌼 🌸 🌼

        </div>

        <div class="bubble" id="message">

            이 문제의 정답은 뭘까? 💕

        </div>

        <!-- 단이 -->

        <div class="dani" id="dani">

            🐶

        </div>

    </div>

    <div class="question" id="question">

        3 × 2 = ?

    </div>

    <div class="answers">

        <button class="answer" id="answer0" onclick="checkAnswer(0)">

            5

        </button>

        <button class="answer" id="answer1" onclick="checkAnswer(1)">

            6

        </button>

        <button class="answer" id="answer2" onclick="checkAnswer(2)">

            8

        </button>

    </div>

    <div class="bottom">

        <button class="action" onclick="restartGame()">

            ↩ 처음부터

        </button>

        <div class="progress">

            <div class="progress-bar" id="progressBar"></div>

        </div>

        <button class="action" onclick="showHint()">

            💡 힌트

        </button>

    </div>

</div>

<!-- 정답 팝업 -->

<div class="popup" id="popup">

    <div class="popup-card">

        <div class="popup-big">

            🐶💕🍖

        </div>

        <div class="popup-title">

            정답이야!

        </div>

        <div class="popup-text" id="popupText">

            단이가 간식을 받았어요!

        </div>

        <button class="next-button" onclick="nextQuestion()">

            다음 문제

        </button>

    </div>

</div>

<script>

let answer = 0;

let correctPosition = 0;

let score = 0;

let coins = 100;

let level = 2;

let solved = 0;

const dani = document.getElementById("dani");

const message = document.getElementById("message");

const question = document.getElementById("question");

const scoreText = document.getElementById("score");

const coinsText = document.getElementById("coins");

const levelText = document.getElementById("level");

const progressBar = document.getElementById("progressBar");

const popup = document.getElementById("popup");

const popupText = document.getElementById("popupText");

const buttons = [

    document.getElementById("answer0"),

    document.getElementById("answer1"),

    document.getElementById("answer2")

];

/* 새 문제 */

function nextQuestion() {

    popup.style.display = "none";

    dani.className = "dani";

    message.innerText =

        "이 문제의 정답은 뭘까? 💕";

    buttons.forEach(function(button) {

        button.disabled = false;

        button.className = "answer";

    });

    /* 곱셈 문제 */

    const number1 =

        Math.floor(Math.random() * 3) + 2;

    const number2 =

        Math.floor(Math.random() * 8) + 2;

    answer = number1 * number2;

    question.innerText =

        number1 + " × " + number2 + " = ?";

    /* 정답 위치 */

    correctPosition =

        Math.floor(Math.random() * 3);

    let wrong1 =

        answer +

        Math.floor(Math.random() * 3) + 1;

    let wrong2 =

        answer -

        Math.floor(Math.random() * 3) - 1;

    if (wrong2 <= 0 || wrong2 === wrong1) {

        wrong2 = answer + 5;

    }

    const options = [];

    options[correctPosition] = answer;

    options[(correctPosition + 1) % 3] = wrong1;

    options[(correctPosition + 2) % 3] = wrong2;

    buttons.forEach(function(button, index) {

        button.innerText = options[index];

    });

    updateProgress();

}

/* 정답 확인 */

function checkAnswer(index) {

    buttons.forEach(function(button) {

        button.disabled = true;

    });

    if (index === correctPosition) {

        score += 10;

        coins += 10;

        solved++;

        buttons[index].classList.add("correct");

        dani.className =

            "dani dani-happy";

        message.innerText =

            "정답이야! 🎉 단이가 신났어요!";

        /* 10문제마다 레벨업 */

        if (solved % 10 === 0) {

            level++;

            levelText.innerText = level;

        }

        updateScore();

        popupText.innerText =

            "⭐ 별 +10  🍖 간식 +10\n현재 간식 " +

            coins +

            "개!";

        popup.style.display = "flex";

    } else {

        buttons[index].classList.add("wrong");

        dani.className =

            "dani dani-sad";

        message.innerText =

            "앗, 아쉬워! 💦\n다시 한번 생각해보자!";

        setTimeout(function() {

            nextQuestion();

        }, 1300);

    }

}

/* 힌트 */

function showHint() {

    message.innerText =

        "💡 힌트! " +

        question.innerText.split("=")[0] +

        "의 답을 생각해봐!";

}

/* 점수 */

function updateScore() {

    scoreText.innerText = score;

    coinsText.innerText = coins;

}

/* 진행도 */

function updateProgress() {

    let progress =

        (solved % 10) * 10;

    progressBar.style.width =

        progress + "%";

}

/* 처음부터 */

function restartGame() {

    score = 0;

    coins = 100;

    level = 2;

    solved = 0;

    scoreText.innerText = 0;

    coinsText.innerText = 100;

    levelText.innerText = 2;

    progressBar.style.width = "0%";

    nextQuestion();

}

/* 첫 문제 */

nextQuestion();

</script>

</body>

</html>
